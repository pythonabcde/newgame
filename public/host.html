<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>主持人 - Connection Sorting</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Host Landing -->
  <div id="hostLanding" class="home">
    <h1>Connection Sorting</h1>
    <p>主持人控制面板</p>

    <div class="home-buttons">
      <button class="primary" onclick="createRoom()">
        创建房间
      </button>
      <button onclick="location.href='/'">
        返回首页
      </button>
    </div>
  </div>

  <!-- Host Lobby -->
  <div id="hostLobby" class="host-lobby hidden">
    <div class="room-code-display">
      <h2>房间代码</h2>
      <div class="room-code" id="roomCode">------</div>
      <p class="join-instructions">
        让学生访问 <strong>game.studinlet.com/join</strong> 并输入此代码
      </p>
    </div>

    <div class="lobby-stats">
      <div class="stat-item">
        <div class="stat-value" id="totalPlayers">0</div>
        <div class="stat-label">总人数</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="team1Count">0</div>
        <div class="stat-label">队伍 1</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="team2Count">0</div>
        <div class="stat-label">队伍 2</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="unassignedCount">0</div>
        <div class="stat-label">未分配</div>
      </div>
    </div>

    <div class="team-assignment">
      <div class="team-column unassigned">
        <h3>未分配</h3>
        <div id="unassignedList" class="drop-zone" data-team="null"></div>
      </div>

      <div class="team-column team1">
        <h3>队伍 1</h3>
        <div id="team1List" class="drop-zone" data-team="TEAM1"></div>
      </div>

      <div class="team-column team2">
        <h3>队伍 2</h3>
        <div id="team2List" class="drop-zone" data-team="TEAM2"></div>
      </div>
    </div>

    <div class="host-controls">
      <button id="startGameBtn" class="primary" onclick="startGame()" disabled>
        开始游戏
      </button>
      <button onclick="endSession()">
        结束会话
      </button>
    </div>
  </div>

  <!-- Host Game View -->
  <div id="hostGameView" class="game-container hidden">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <div class="hud-top">
        <div class="timer" id="timer">5:00</div>
        <div class="player-count" id="playerCount">玩家: 0</div>
      </div>
    </div>
  </div>

  <!-- Host End Screen -->
  <div id="hostEndScreen" class="end-screen hidden">
    <div class="end-screen-content">
      <h1>时间到！</h1>
      <div class="accuracy-display" id="accuracyPercent">0%</div>
      <p>全班分类准确率</p>

      <div class="end-stats">
        <div class="stat-row">
          <span>正确人数:</span>
          <span id="correctPlayers">0</span>
        </div>
        <div class="stat-row">
          <span>总人数:</span>
          <span id="totalPlayersEnd">0</span>
        </div>
        <div class="stat-row">
          <span><strong>队伍 1 准确率:</strong></span>
          <span id="team1Accuracy">0%</span>
        </div>
        <div class="stat-row">
          <span><strong>队伍 2 准确率:</strong></span>
          <span id="team2Accuracy">0%</span>
        </div>
      </div>

      <div class="end-screen-buttons">
        <button class="primary" onclick="returnToLobby()">
          返回大厅
        </button>
        <button onclick="endSession()">
          结束会话
        </button>
      </div>
    </div>
  </div>

  <script src="/js/renderer.js"></script>
  <script src="/js/host.js"></script>
</body>
</html>
